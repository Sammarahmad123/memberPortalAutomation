# Triggered by repository_dispatch from the app repo, manually, or by a PR.
# Publishes the Playwright HTML report to THIS repo's GitHub Pages only —
# the application repo Pages site is never touched.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
  pull_request:
    branches: [main]

# Required for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# PRs: cancel the previous run for the same PR when a new commit is pushed.
# Pages deployments: never cancel in-flight so a partially-deployed report
# is never left in a broken state.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Playwright tests and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # BASE_URL comes from the dispatch payload (app repo trigger) or falls
      # back to the canonical GitHub Pages URL for manual / PR runs.
      #
      # continue-on-error is conditional:
      #   pull_request → false: a test failure immediately fails the required
      #                         status check so the PR cannot be merged.
      #   dispatch / manual → true: captures the exit code so the Pages deploy
      #                             steps still run; job is re-failed at the end.
      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      # ── Pull request path ────────────────────────────────────────────────────
      # Upload the report as a downloadable artifact.
      # always() is required so this step runs even when the test step failed.
      - name: Upload report artifact (PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # ── Dispatch / manual path ───────────────────────────────────────────────
      # Deploy the report to this repo's GitHub Pages.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload Playwright report to Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        if: github.event_name != 'pull_request'
        id: deploy
        uses: actions/deploy-pages@v4

      # Re-raise the test failure now that the report is safely published.
      # Not needed for PRs — continue-on-error is false there, so the test
      # step already fails the job directly.
      - name: Re-raise test failure
        if: github.event_name != 'pull_request' && steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed — report published at ${{ steps.deploy.outputs.page_url }}"
          exit 1
