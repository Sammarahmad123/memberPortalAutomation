# Triggered by repository_dispatch from the app repo, manually, or by a PR.
# PRs only validate the automation tests. Dispatch/manual runs may deploy the
# Playwright report to this automation repo's GitHub Pages.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-pr:
    name: Validate Playwright tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: https://sammarahmad123.github.io/super-member-portal-demo/

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  maintenance-analysis:
    name: Run Playwright tests and publish maintenance evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare maintenance folders
        run: mkdir -p maintenance/evidence maintenance/manifests maintenance/reports

      - name: Run Playwright tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          npx playwright test 2>&1 | tee maintenance/evidence/playwright-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      - name: Run Gemini maintenance analysis
        if: steps.tests.outputs.exit_code != '0'
        run: npm run ai:maintenance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-analysis
          path: |
            maintenance/evidence/
            maintenance/manifests/
            maintenance/reports/
          retention-days: 14

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload Playwright report to Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        if: always()
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Re-raise test failure
        if: steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Tests failed. Maintenance artifacts were uploaded and the Playwright report was published."
          exit 1
