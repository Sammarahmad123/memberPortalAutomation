# Triggered by repository_dispatch from the app repo, manually, or by a PR.
# PRs only validate the automation tests. Dispatch/manual runs may deploy the
# Playwright report to this automation repo's GitHub Pages.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests-outcome: ${{ steps.dispatch-tests.outputs.tests-outcome || steps.pr-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # PR runs are validation only. They do not run Gemini and do not deploy Pages.
      - name: Run Playwright tests
        id: pr-tests
        if: github.event_name == 'pull_request'
        run: npx playwright test
        env:
          BASE_URL: https://sammarahmad123.github.io/super-member-portal-demo/

      # Dispatch/manual runs keep going after test failure so maintenance
      # artifacts and the Playwright HTML report can be published first.
      - name: Prepare maintenance folders
        if: github.event_name != 'pull_request'
        run: mkdir -p maintenance/evidence maintenance/manifests maintenance/reports

      - name: Run Playwright tests and capture output
        id: dispatch-tests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          npx playwright test 2>&1 | tee maintenance/evidence/playwright-output.txt
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            echo "tests-outcome=success" >> "${GITHUB_OUTPUT}"
          else
            echo "tests-outcome=failure" >> "${GITHUB_OUTPUT}"
          fi
          exit 0
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      - name: Run Gemini maintenance analysis
        if: github.event_name != 'pull_request' && steps.dispatch-tests.outputs.tests-outcome == 'failure'
        run: npm run ai:maintenance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      - name: Upload maintenance artifacts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-analysis
          path: |
            maintenance/evidence/
            maintenance/manifests/
            maintenance/reports/
          retention-days: 14

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Runs only for dispatch / manual, never for pull_request.
  # This is the only place that references the github-pages environment, so PR
  # runs are completely isolated from it.
  deploy-report:
    name: Deploy report to GitHub Pages
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download playwright-report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload report to Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Re-raise the test failure now that reports and maintenance artifacts
      # have been published.
      - name: Re-raise test failure
        if: needs.test.outputs.tests-outcome == 'failure'
        run: |
          echo "::error::Tests failed. Maintenance artifacts were uploaded and the Playwright report was published."
          exit 1
