# Triggered by repository_dispatch from the app repo, manually, or by a PR.
# Publishes the Playwright HTML report to THIS repo's GitHub Pages only —
# the application repo Pages site is never touched.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
  pull_request:
    branches: [main]

# pages: write + id-token: write are needed by the deploy-report job.
# They are harmless on PR runs because deploy-report is skipped entirely.
permissions:
  contents: read
  pages: write
  id-token: write

# PRs:            cancel the old run for the same PR on each new push.
# Pages deploys:  never cancel in-flight — a partial deploy leaves Pages broken.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Job 1: test ────────────────────────────────────────────────────────────
  # Runs on every trigger.
  # Intentionally has NO environment block — PR runs must never be treated as
  # a deployment attempt and must never touch the github-pages environment.
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Export the raw test-step outcome so deploy-report can re-raise the failure
    # after the report is safely published.
    outputs:
      tests-outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # BASE_URL: comes from the dispatch payload (app repo trigger) or falls
      # back to the canonical GitHub Pages URL for manual / PR runs.
      #
      # continue-on-error behaviour:
      #   pull_request  → false  Test failure immediately fails this job so the
      #                          required status check blocks the PR merge.
      #   dispatch/manual → true  Captures the exit code without failing the job,
      #                           letting the artifact upload and deploy-report
      #                           job still run. The workflow is re-failed after
      #                           the report is published.
      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      # Always upload the report as a plain artifact.
      # • PR runs:            directly downloadable from the run summary.
      # • Dispatch/manual:    picked up by the deploy-report job below.
      # always() is required so this step runs even when the test step just
      # failed the job (PR with continue-on-error: false).
      - name: Upload playwright-report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Job 2: deploy-report ───────────────────────────────────────────────────
  # Runs only for dispatch / manual — never for pull_request.
  # This is the ONLY place that references the github-pages environment, so PR
  # runs are completely isolated from it.
  deploy-report:
    name: Deploy report to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Download the artifact that the test job uploaded.
      - name: Download playwright-report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload report to Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Re-raise the test failure now that the report is safely published.
      # Reads the outcome exported by the test job — 'failure' even when
      # continue-on-error kept that job green.
      - name: Re-raise test failure
        if: needs.test.outputs.tests-outcome == 'failure'
        run: |
          echo "::error::Tests failed — report published at ${{ steps.deploy.outputs.page_url }}"
          exit 1
