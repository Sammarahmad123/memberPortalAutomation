# Triggered by repository_dispatch from the app repo, manually, or by a PR.
# PRs validate tests and publish artifacts only. Dispatch/manual runs may deploy
# the Playwright report to this automation repo's GitHub Pages.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated, pr-preview-ready]
  workflow_dispatch:
  pull_request:
    branches: [main]

# pages: write + id-token: write are needed by the deploy-report job.
# They are harmless on PR runs because deploy-report is skipped entirely.
permissions:
  contents: read
  pages: write
  id-token: write

# PRs: cancel the old run for the same PR on each new push.
# Pages deploys: never cancel in-flight - a partial deploy leaves Pages broken.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: test
  # Runs on every trigger.
  # Intentionally has no environment block. PR runs must never be treated as
  # deployment attempts and must never touch the github-pages environment.
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      tests-outcome: ${{ steps.tests.outcome }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps

      # For pull_request runs: read the <!-- app-preview-url: ... --> comment
      # embedded in the PR body by /apply-fixes. If present, tests run against
      # that preview URL instead of the live main site.
      # For dispatch/manual runs: use client_payload.app_url if provided.
      # Falls back to the live main site in all other cases.
      - name: Resolve BASE_URL
        id: base-url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_URL="https://sammarahmad123.github.io/super-member-portal-demo/"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PREVIEW_URL=$(gh pr view ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --json body -q '.body' \
              | grep -o '<!-- app-preview-url: [^ ]* -->' \
              | sed 's/<!-- app-preview-url: //;s/ -->//' \
              | tr -d '[:space:]')
            if [ -n "$PREVIEW_URL" ]; then
              echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              echo "Using app preview URL: $PREVIEW_URL"
            else
              echo "url=$DEFAULT_URL" >> "$GITHUB_OUTPUT"
              echo "No app-preview-url comment found, using default: $DEFAULT_URL"
            fi
          else
            DISPATCH_URL="${{ github.event.client_payload.app_url }}"
            if [ -n "$DISPATCH_URL" ]; then
              echo "url=$DISPATCH_URL" >> "$GITHUB_OUTPUT"
              echo "Using dispatch app_url: $DISPATCH_URL"
            else
              echo "url=$DEFAULT_URL" >> "$GITHUB_OUTPUT"
              echo "Using default URL: $DEFAULT_URL"
            fi
          fi

      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          BASE_URL: ${{ steps.base-url.outputs.url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Job 2: deploy-report
  # Runs only for dispatch / manual, never for pull_request.
  # This is the only place that references the github-pages environment, so PR
  # runs are completely isolated from it.
  deploy-report:
    name: Deploy report to GitHub Pages
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Re-raise test failure
        if: needs.test.outputs.tests-outcome == 'failure'
        run: |
          echo "::error::Tests failed — Playwright report published at ${{ steps.deploy.outputs.page_url }}"
          exit 1
