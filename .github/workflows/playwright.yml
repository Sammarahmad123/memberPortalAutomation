name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel in-flight so a
# partially-deployed report isn't left in a broken state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run tests and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # continue-on-error keeps the subsequent Pages steps running even when
      # tests fail; the final step re-raises the failure after the report is live.
      - name: Run Playwright tests
        id: tests
        run: npm test
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Fail the job now that the report is safely published.
      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed — report published at ${{ steps.deploy.outputs.page_url }}"
          exit 1
