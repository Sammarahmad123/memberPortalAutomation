# Triggered by the application repo after a successful GitHub Pages deployment,
# or manually from the Actions tab.
# Publishes the Playwright HTML report to THIS repo's GitHub Pages only —
# the application repo Pages site is never touched.
name: Playwright Tests

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:

# Required for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel in-flight so a
# partially-deployed report is never left in a broken state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests and publish report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # BASE_URL comes from the dispatch payload when triggered by the app repo.
      # Falls back to the canonical GitHub Pages URL for manual runs.
      # continue-on-error keeps the Pages steps running even when tests fail;
      # the final step re-raises the failure after the report is live.
      - name: Run Playwright tests
        id: tests
        run: npx playwright test
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.client_payload.app_url || 'https://sammarahmad123.github.io/super-member-portal-demo/' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Playwright report to Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to automation repo GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Fail the job now that the report is safely published.
      - name: Re-raise test failure
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed — report published at ${{ steps.deploy.outputs.page_url }}"
          exit 1
